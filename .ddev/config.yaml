name: mercury
type: silverstripe
docroot: public
php_version: "8.2"
webserver_type: apache-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
    type: mysql
    version: "8.0"
use_dns_when_possible: true
composer_version: "2"
web_environment: []
corepack_enable: false
nodejs_version: "22"
web_extra_exposed_ports:
    - name: Vite Dev Server
      container_port: 5171
      http_port: 5171
      https_port: 5172
hooks:
 post-start:
   - exec: "npm install && npm run dev"